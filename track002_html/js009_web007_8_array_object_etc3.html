<!DOCTYPE html>
<html lang="ko">
<head>
  <title>Avengers Members - Ajax Fetch</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container my-3">
  <h3 class="card-header">Avengers Members</h3> 
  <table class="table table-striped table-bordered" id="memberTable">
    <thead>
      <tr><th>Image</th><th>Name</th><th>Age</th><th>Address</th><th>Mobile</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
 

<script>    
    fetch("./data/member.xml")  //경로
    .then( res => res.text() ) //결과물
    .then( xml => {  
      let parser  = new DOMParser();  //dom으로 만들어주는 도구
      let xmlDoc  = parser.parseFromString(xml, "application/xml"); //xml형식
      let member = xmlDoc.getElementsByTagName("member");
      let result  = "";      
      for(let mem  of member){
        let img    = mem.getElementsByTagName("img")[0].textContent;
        let name    = mem.getElementsByTagName("name")[0].textContent;
        let age     = mem.getElementsByTagName("age")[0].textContent;
        let address = mem.getElementsByTagName("address")[0].textContent;
        let mobile  = mem.getElementsByTagName("mobile")[0].textContent;
        result += `<tr><td><img src="${img}" style="width:90px; height: 90px;"/></td><td>${name}</td><td>${age}</td><td>${address}</td><td>${mobile}</td></tr>`;
      }
      document.querySelector("#memberTable tbody").innerHTML = result;
    }) // 성공
    .catch(err => {
      document.querySelector("#memberTable tbody").innerHTML ="에러메시지 : " + err.message; 
      console.log(err.message);      
    } ); //실패      
</script>
</body>
</html>
